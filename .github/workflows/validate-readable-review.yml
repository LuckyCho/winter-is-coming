name: Validate readable AI dashboard
on:
  push:
    branches: [feature/readable-synthesis-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JavaScript and Python syntax
        run: |
          node --check app.js
          python -m compileall -q scripts
          python -m unittest discover -s tests -v
      - name: Verify review completeness and tooltip definitions without calling API
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/analysis.json').read_text())
          review=data['review']
          assert review['headline'].strip()
          ids=[r['id'] for r in review['positives']+review['cautions']]
          expected={'us_curve','us_cli','kr_cli','us_gz','us_ebp','us_recession_prob'}
          assert len(ids)==6 and set(ids)==expected
          assert len(review['watchpoints'])>=2
          js=Path('app.js').read_text()
          css=Path('styles.css').read_text()
          for x in expected: assert x+':' in js, x
          for x in ('review-summary','review-grid','review-watch','indicator-help','indicator-popover'):
              assert x in js and x in css, x
          print('SUCCESS: 6 glossary definitions, 6 structured points, 2+ watchpoints; zero API calls')
          PY
