name: Validate approved chart redesign
on:
  push:
    branches: [feature/legible-interactive-charts-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax and actual chart rendering
        run: |
          node --check app.js
          node tests/chart.test.cjs
      - name: Data scripts unit tests
        run: python -m unittest discover -s tests -v
      - name: Confirm data is six series and no new AI call
        run: |
          python - <<'PY'
          import json
          data=json.load(open("data/indicators.json"))
          assert len(data["indicators"]) == 6
          assert all(len(e["series"])>12 for e in data["indicators"])
          assert "review" in json.load(open("data/analysis.json"))
          print("PASS six existing series, saved AI text, zero API calls")
          PY
